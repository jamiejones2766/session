<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Session</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0E13">
<style>
:root{
  --bg:#0A0E13;--panel:#141B24;--hi:#1B242F;--line:#232E3A;
  --ink:#EAF0F6;--mut:#7A8B9D;--dim:#4A5A6B;
  --work:#E8734A;--go:#2DBE9B;--rest:#FFD166;--danger:#EF476F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100%;overscroll-behavior:none}
body{max-width:520px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{border:none;cursor:pointer;font-family:inherit;color:inherit;background:none}
button:active{opacity:.85}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.brand{font-weight:800;font-size:15px;letter-spacing:.24em;border-left:3px solid var(--go);padding-left:8px}
.date{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);letter-spacing:.1em}
.page{padding:6px 14px 20px}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5;margin:4px 2px 14px}
.small{font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
.row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px;margin-bottom:8px;min-height:64px;text-align:left}
.mname{display:block;font-weight:700;font-size:17px}
.msub{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mut);margin-top:3px}
.pips{display:flex;gap:5px}
.pip{width:10px;height:10px;border-radius:2px;background:var(--line)}
.pip.done{background:var(--go)}
.logger{background:var(--hi);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:14px;margin:-8px 0 10px}
.steprow{display:flex;gap:12px;justify-content:space-around}
.stepper{display:flex;align-items:center;gap:8px}
.stepbtn{width:54px;height:54px;border-radius:8px;background:var(--panel);font-size:26px;font-family:ui-monospace,monospace}
.stepval{font-family:ui-monospace,Menlo,monospace;font-size:26px;text-align:center;min-width:76px}
.steplbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;text-align:center}
.rperow{display:flex;gap:6px}
.rpelab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 5px}
.rpehint{text-transform:none;letter-spacing:0;opacity:.65}
.rpebtn{flex:1;height:50px;border-radius:8px;font-family:ui-monospace,monospace;font-size:17px;background:var(--hi);color:var(--mut)}
.rpebtn.sel-lo{background:var(--go);color:#0A0E13}
.rpebtn.sel-mid{background:var(--work);color:#0A0E13}
.rpebtn.sel-hi{background:var(--danger);color:#0A0E13}
.big{width:100%;height:62px;margin-top:12px;border-radius:8px;background:var(--go);color:#0A0E13;
  font-weight:800;font-size:18px;letter-spacing:.06em}
.big:disabled{opacity:.35}
.big.quiet{background:var(--hi);color:var(--mut)}
.big.huge{height:100px;font-size:26px}
.timerfull{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 16px;gap:8px;transition:background .4s}
.phase{font-weight:800;font-size:19px;letter-spacing:.22em}
.clock{font-family:ui-monospace,Menlo,monospace;font-size:min(24vw,110px);font-variant-numeric:tabular-nums;line-height:1;margin:12px 0}
.splits{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);margin-top:12px;text-align:center;line-height:1.8}
textarea{width:100%;min-height:70px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:12px;font-size:14px;font-family:ui-monospace,monospace}
textarea.report{min-height:260px;font-size:12.5px;line-height:1.6}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:var(--hi);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav{flex:1;height:60px;font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--dim);border-top:3px solid transparent}
.nav.on{color:var(--ink);border-top-color:var(--go)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--go);color:#0A0E13;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap;z-index:10}
.back{color:var(--dim);font-family:ui-monospace,monospace;font-size:13px;padding:8px 2px;display:block}
.flex{display:flex;gap:10px}
.flex .big{flex:1;margin-top:0}
.wl{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);letter-spacing:.08em;text-align:center;margin-top:6px}

.field{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:14px;font-size:14px;font-family:ui-monospace,monospace;margin-bottom:8px}
.gear{font-size:20px;color:var(--dim);padding:4px 6px}
.link{color:var(--go);font-size:12.5px;text-decoration:underline;display:inline}
.daytitle{font-weight:800;font-size:26px;margin:2px 0 2px}
.noteblock{background:var(--hi);border-left:3px solid var(--go);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px;font-size:13.5px;color:var(--mut);line-height:1.5}


.daychips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.chip.istoday{border-color:var(--go);color:var(--ink)}
.chip.on{background:var(--go);border-color:var(--go);color:#0A0E13}


.grpcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.grpcard.grpdone{border-color:var(--go)}
.grphead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:14px 12px;text-align:left;color:var(--ink)}
.grpchev{flex:0 0 auto;font-size:20px;font-weight:800;color:var(--go);transition:transform .15s;display:inline-block}
.grpchev.open{transform:rotate(90deg)}
.grpname{flex:1 1 auto;font-size:14px;font-weight:800;letter-spacing:.03em}
.grpmeta{flex:0 0 auto;font-size:12px;color:var(--mut);font-family:ui-monospace,monospace}
.grpbody{padding:0 10px 10px}
.grpbody .stepcard{background:var(--hi)}
.stepcard{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;align-items:flex-start}
.stepcard.ticked{border-color:var(--go);background:#10231D}
.steptick{flex:0 0 auto;width:46px;height:46px;border-radius:8px;border:2px solid var(--line);background:var(--hi);color:var(--go);font-size:22px;font-weight:800}
.stepcard.ticked .steptick{border-color:var(--go);background:var(--go);color:#0A0E13}
.chipstart{margin-top:8px;padding:8px 14px;border-radius:6px;background:var(--work);color:#0A0E13;font-size:12.5px;font-weight:800;letter-spacing:.06em}
.pausebtn{background:var(--hi);color:var(--rest);border:1px solid var(--rest);border-radius:8px;height:56px;font-size:15px;font-weight:800;letter-spacing:.08em;width:100%;margin-top:10px}
.pausedbadge{color:var(--rest);font-size:13px;font-weight:800;letter-spacing:.08em;margin-top:6px}
.stepbody{flex:1;min-width:0}
.steplabel{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stepsecs{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);font-weight:400}
.amrapitems{margin:8px 0 2px}
.amrapitem{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--mut);padding:5px 0;border-bottom:1px solid var(--line)}
.amrapitem:last-child{border-bottom:none}
.stepnumsm{flex:0 0 auto;width:20px;height:20px;border-radius:4px;background:var(--hi);color:var(--dim);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace}

</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
